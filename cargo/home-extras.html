  var currentMms = document.querySelector('.mms');

  var restMsg = null;
  var scheduled = false;
  var scheduledFrame = 0;
  var lastCompactMode = null;
  var lastGameHeight = 0;
  var lastGameWidth = 0;
  var gameHeightLocked = false;

    scheduled = false;
    restMsg = null;
    currentMms.style.removeProperty('--mobile-game-px-width');
