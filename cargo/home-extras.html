<style>#mms-tw-rig{position:absolute;left:0;top:0;width:285px;z-index:20;pointer-events:none;display:none;}#mms-tw-rig .tweezer-back,#mms-tw-rig .tweezer-front{position:absolute;left:0;top:0;width:100%;pointer-events:none;transform:translate(-4%,-4%) scale(.98);transform-origin:5% 5%;}#mms-tw-rig .tweezer-back{z-index:1;}#mms-tw-rig .drag-sticker{position:absolute;left:0;top:0;z-index:3;pointer-events:none;opacity:.99;transform:translate(var(--drag-offset-x,calc(-100% + 18px)),var(--drag-offset-y,calc(-100% + 15px))) rotate(var(--drag-r,0deg)) scale(1.06);transform-origin:var(--drag-origin-x,calc(100% - 18px)) var(--drag-origin-y,calc(100% - 15px));}#mms-tw-rig .tweezer-front{z-index:6;}#mms-tw-rig img[hidden]{display:none;}</style><div id="mms-tw-rig"></div><script>/* mms-tweezer-overlay v3 — desktop escaped rig + compact iframe sizing */
(function () {
  var registry = window.__mmsRuntimeLifecycle;
  var currentMms = document.querySelector('.mms');
  var OWNER_VERSION = 'tweezer-v3/root-lifecycle-1';
  if (!registry || registry.apiVersion !== 1 || !currentMms) return;
  registry.teardownStale(currentMms);
  var previousOwner = registry.owners.home;
  var currentRig = currentMms.querySelector('#mms-tw-rig') || document.getElementById('mms-tw-rig');
  var currentFrame = currentMms.querySelector('iframe.mms-game');
  var currentRiver = currentFrame && currentFrame.closest('.mms-river');
  if (previousOwner && previousOwner.root === currentMms &&
      previousOwner.version === OWNER_VERSION && previousOwner.active() &&
      previousOwner.rig === currentRig && previousOwner.frame === currentFrame &&
      previousOwner.river === currentRiver && currentRig && currentRig.isConnected &&
      currentFrame && currentFrame.isConnected && currentRiver && currentRiver.isConnected) {
    if (currentRig) {
      document.querySelectorAll('#mms-tw-rig').forEach(function (candidate) {
        if (candidate !== currentRig) candidate.remove();
      });
    }
    window.__mmsTwOverlayV3 = 1;
    return;
  }
  if (previousOwner && typeof previousOwner.teardown === 'function') previousOwner.teardown();
  var runtime = registry.create('home', currentMms, OWNER_VERSION);
  registry.replace('home', runtime);
  window.__mmsTwOverlayV3 = 1;
  var ownedRig = currentRig;
  var frame = currentFrame;
  var river = currentRiver;
  runtime.rig = ownedRig;
  runtime.frame = frame;
  runtime.river = river;

  function rig() {
    return ownedRig;
  }
  function mountRig() {
    var node = rig();
    if (node && node.parentNode !== currentMms) currentMms.appendChild(node);
    return node;
  }
  function gameFrame() { return frame; }
  function compact() { return window.matchMedia('(max-width: 1023px)').matches; }
  function hideRig() {
    var node = rig();
    if (node) node.style.display = 'none';
  }
  mountRig();
  var removeRiverScroll = null;
  var desktopHeight = frame ? frame.style.height : '';
  var restMsg = null;
  var scheduled = false;
  var scheduledFrame = 0;
  var lastCompactMode = null;
  var lastGameHeight = 0;
  var lastGameWidth = 0;
  var gameHeightLocked = false;
  var EASE = 'left .45s cubic-bezier(.22,.61,.36,1), top .45s cubic-bezier(.22,.61,.36,1)';
  var TWEEZER_OPEN_SRC = 'https://freight.cargo.site/t/original/i/T3022869107490037873358127281977/tweezer-open.png';
  var TWEEZER_CLOSED_SRC = 'https://freight.cargo.site/t/original/i/N3022869107453144385210708178745/tweezer-close.png';
  var TWEEZER_FRONT_SRC = 'https://freight.cargo.site/t/original/i/V3022869107471591129284417730361/tweezer-front-arm.png';
  var APPROVED_STICKER_SRCS = {
    'https://freight.cargo.site/t/original/i/U3022869107434697641136998627129/sticker-touchbaes.png': true,
    'https://freight.cargo.site/t/original/i/B3022869107397804152989579523897/sticker-plant.png': true,
    'https://freight.cargo.site/t/original/i/F3022869107379357408915869972281/sticker-cat.png': true,
    'https://freight.cargo.site/t/original/i/Q3022869107416250897063289075513/sticker-right-bottles.png': true
  };

  function syncCompactGeometry(force) {
    if (!compact()) return;
    var viewportWidth = Math.round(window.innerWidth);
    var width = Math.round(Math.min(viewportWidth, (viewportWidth * 0.98) + 5));
    if (!force && width === lastGameWidth) return;
    lastGameWidth = width;
    lastGameHeight = 0;
    gameHeightLocked = false;
    var left = Math.round(32 + (width * 0.0525));
    var right = 36;
    var bottom = Math.round(31 + (width * 0.193));
    /* Match the child's integer-pixel envelope. Ceil made the placeholder
       frame one pixel taller than the live game at common phone widths. */
    var fallbackHeight = Math.round(24 + ((width - left - right) * 1752 / 1586) + bottom);
    currentMms.style.setProperty('--mobile-game-px-width', width + 'px');
    currentMms.style.setProperty('--mobile-game-px-height', fallbackHeight + 'px');
  }

  function attrValue(tag, name) {
    var pattern = new RegExp("(?:^|\\s)" + name + "\\s*=\\s*([\\\"'])(.*?)\\1", "i");
    var match = String(tag || '').match(pattern);
    return match ? match[2] : '';
  }
  function imgTag(html, className) {
    var source = String(html || '');
    var pattern = /<img\b[^>]*>/gi;
    var match;
    while ((match = pattern.exec(source))) {
      var tag = match[0];
      if (attrValue(tag, 'class').split(/\s+/).indexOf(className) !== -1) return tag;
    }
    return '';
  }
  function numericStyle(style, property, unit) {
    var pattern = new RegExp('(?:^|;)\\s*' + property.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*(-?\\d+(?:\\.\\d+)?)' + unit + '\\s*(?:;|$)');
    var match = String(style || '').match(pattern);
    return match ? match[1] + unit : '';
  }
  function trustedImage(className, source, hidden) {
    var image = document.createElement('img');
    image.className = className;
    image.alt = '';
    image.src = source;
    image.hidden = Boolean(hidden);
    return image;
  }
  function trustedRigMarkup(data) {
    var html = typeof data.html === 'string' && data.html.length < 5000 ? data.html : '';
    var backTag = imgTag(html, 'tweezer-back');
    var dragTag = imgTag(html, 'drag-sticker');
    var frontTag = imgTag(html, 'tweezer-front');
    var backSrc = attrValue(backTag, 'src');
    var frontSrc = attrValue(frontTag, 'src');
    if (backSrc !== TWEEZER_OPEN_SRC && backSrc !== TWEEZER_CLOSED_SRC) return null;
    if (frontSrc !== TWEEZER_FRONT_SRC) return null;
    var fragment = document.createDocumentFragment();
    fragment.appendChild(trustedImage('tweezer-back', backSrc, /\shidden(?:\s|>|=)/i.test(backTag)));
    var dragSrc = attrValue(dragTag, 'src');
    var drag = trustedImage('drag-sticker', APPROVED_STICKER_SRCS[dragSrc] ? dragSrc : TWEEZER_OPEN_SRC,
      !APPROVED_STICKER_SRCS[dragSrc] || /\shidden(?:\s|>|=)/i.test(dragTag));
    var dragStyle = attrValue(dragTag, 'style');
    var width = numericStyle(dragStyle, 'width', 'px');
    if (width) drag.style.width = width;
    [
      ['--drag-r', 'deg'],
      ['--drag-offset-x', 'px'],
      ['--drag-offset-y', 'px'],
      ['--drag-origin-x', 'px'],
      ['--drag-origin-y', 'px']
    ].forEach(function (entry) {
      var value = numericStyle(dragStyle, entry[0], entry[1]);
      if (value) drag.style.setProperty(entry[0], value);
    });
    fragment.appendChild(drag);
    fragment.appendChild(trustedImage('tweezer-front', frontSrc, /\shidden(?:\s|>|=)/i.test(frontTag)));
    return fragment;
  }

  function place(data, animate) {
    var node = mountRig();
    var iframe = gameFrame();
    if (!node || !iframe || compact()) {
      hideRig();
      return;
    }
    var width = Number(data.w);
    var tx = Number(data.tx);
    var ty = Number(data.ty);
    if (!Number.isFinite(width) || width < 1 || width > 600 ||
        !Number.isFinite(tx) || Math.abs(tx) > 4000 ||
        !Number.isFinite(ty) || Math.abs(ty) > 4000) {
      hideRig();
      return;
    }
    node.style.zIndex = '20';
    node.style.width = width + 'px';
    var trusted = trustedRigMarkup(data);
    if (!trusted) {
      hideRig();
      return;
    }
    node.replaceChildren(trusted);
    var offsetParent = node.offsetParent || document.body;
    var parentRect = offsetParent.getBoundingClientRect();
    var frameRect = iframe.getBoundingClientRect();
    if (animate) {
      node.style.transition = EASE;
      void node.offsetHeight;
    } else {
      node.style.transition = 'none';
    }
    node.style.left = frameRect.left - parentRect.left + tx + 'px';
    node.style.top = frameRect.top - parentRect.top + ty + 'px';
    node.style.display = 'block';
  }

  function applyGameHeight(height, edgeReserve) {
    var iframe = gameFrame();
    if (!iframe || !compact() || !Number.isFinite(height) || height <= 0) return;
    if (!edgeReserve || ['left', 'right', 'bottom'].some(function (key) {
      var value = Number(edgeReserve[key]);
      return !Number.isFinite(value) || value < 0 || value > 320;
    })) return;
    var stableHeight = Math.max(1, Math.ceil(height));
    var currentHeight = Math.round(iframe.getBoundingClientRect().height);
    /* Fractional aspect-ratio rounding can make the parent's fallback differ
       from the child's integer envelope by one pixel at a few compact widths.
       Treat that as the same envelope so readiness never nudges the river. */
    if (!gameHeightLocked && Math.abs(stableHeight - currentHeight) <= 1) {
      lastGameHeight = currentHeight;
      gameHeightLocked = true;
      iframe.dataset.gameMeasured = 'true';
      return;
    }
    if (gameHeightLocked || Math.abs(stableHeight - lastGameHeight) < 1) return;
    lastGameHeight = stableHeight;
    gameHeightLocked = true;
    iframe.dataset.gameMeasured = 'true';
    currentMms.style.setProperty('--mobile-game-px-height', stableHeight + 'px');
    iframe.style.setProperty('height', stableHeight + 'px', 'important');
  }

  function syncMode(force) {
    var iframe = gameFrame();
    if (!iframe) return;
    var isCompact = compact();
    if (force || isCompact !== lastCompactMode) {
      lastCompactMode = isCompact;
      try {
        iframe.contentWindow.postMessage({ __mmsGameMode: 1, compact: isCompact }, '*');
      } catch (e) {}
    }
    if (isCompact) {
      syncCompactGeometry(force);
      hideRig();
    } else {
      delete iframe.dataset.gameMeasured;
      iframe.style.removeProperty('height');
      if (desktopHeight) iframe.style.setProperty('height', desktopHeight);
      if (restMsg) place(restMsg, false);
    }
  }

  runtime.on(window, 'message', function (event) {
    var iframe = gameFrame();
    if (!iframe || event.source !== iframe.contentWindow) return;
    var expectedOrigin = '';
    try {
      expectedOrigin = new URL(iframe.dataset.mmsSource || iframe.getAttribute('data-src') || iframe.src, window.location.href).origin;
    } catch (e) {}
    if (!expectedOrigin || event.origin !== expectedOrigin) return;
    var data = event.data;
    if (!data) return;
    if (data.__mmsGameSize) {
      if (Number(data.geometryVersion) !== 10) return;
      if (Boolean(data.compact) !== compact()) return;
      applyGameHeight(Number(data.height), data.edgeReserve);
      return;
    }
    if (!data.__tw) return;
    if (compact() || data.t === 'hide') {
      hideRig();
      return;
    }
    if (data.t === 'move' || data.t === 'freeze' || data.t === 'rest') {
      if (data.t === 'rest') restMsg = data;
      place(data, data.t === 'rest');
    }
  });

  function reposition() {
    scheduled = false;
    scheduledFrame = 0;
    if (!compact() && restMsg) place(restMsg, false);
  }
  function schedule() {
    if (compact()) return;
    if (scheduled) return;
    scheduled = true;
    scheduledFrame = runtime.raf(reposition);
  }
  function syncRiverListener() {
    if (!river) return;
    var shouldBind = !compact();
    if (shouldBind && !removeRiverScroll) {
      removeRiverScroll = runtime.on(river, 'scroll', schedule, { passive: true });
    } else if (!shouldBind && removeRiverScroll) {
      removeRiverScroll();
      removeRiverScroll = null;
    }
  }
  if (frame) runtime.on(frame, 'load', function () { syncMode(true); });
  runtime.on(window, 'resize', function () {
    syncCompactGeometry(false);
    syncMode(false);
    syncRiverListener();
    schedule();
  });
  runtime.cleanup(function () {
    if (removeRiverScroll) {
      removeRiverScroll();
      removeRiverScroll = null;
    }
    if (scheduledFrame) runtime.cancelRaf(scheduledFrame);
    scheduledFrame = 0;
    scheduled = false;
    restMsg = null;
    currentMms.style.removeProperty('--mobile-game-px-width');
    currentMms.style.removeProperty('--mobile-game-px-height');
    if (frame) {
      delete frame.dataset.gameMeasured;
      frame.style.removeProperty('height');
      if (desktopHeight) frame.style.setProperty('height', desktopHeight);
    }
    var node = rig();
    if (node) {
      node.style.display = 'none';
      node.style.transition = 'none';
      node.replaceChildren();
    }
    if (registry.owners.home === runtime && window.__mmsTwOverlayV3 === 1) {
      delete window.__mmsTwOverlayV3;
    }
  });
  syncRiverListener();
  syncMode(true);
})();
</script>
