<!-- Cargo embed snippet
Upload the extracted booklet folder to your website host, then replace the iframe src with the public URL for index.html. -->
<div style="width: 100%; aspect-ratio: 21 / 9;">
  <iframe
    src="https://your-host.example/booklet/index.html"
    title="Interactive booklet"
    loading="lazy"
    style="width: 100%; height: 100%; border: 0; display: block;"
    allowtransparency="true"
    allow="fullscreen"
  ></iframe>
</div>
