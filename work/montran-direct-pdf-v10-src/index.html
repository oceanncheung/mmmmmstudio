    <title>Flippable booklet</title>
    <style>

      * { box-sizing: border-box; }

      html,

        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {

        color: var(--ink);
        background: var(--panel);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      body.has-transparent-background { background: transparent; }

        inset: 0;
        display: grid;
        place-items: center;
        padding: 0;

      .frame {

        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background-color: var(--booklet-bg, oklch(90% 0 0));
        background-image: var(--booklet-bg-image, none);

      .book-mount {

        left: 50%;
        top: 50%;
        overflow: visible;
        isolation: isolate;
        transform: translate(-50%, -50%);

      .book-mount.is-opening-cover .book-shadow-bed,

        z-index: 1;

      .flip-book {

        height: 100%;

        inset: 0;

        max-width: none;

      .cover-image,
      .page-image {

        width: 100%;
        height: 100%;

        transform: none;

      .blank-page { box-shadow: inset 0 0 0 1px oklch(89% 0 0); }

      body.controls-hidden .stage { padding: 0; }

        height: 100%;

        position: absolute;
        left: 50%;
        bottom: 14%;

      .message {
        position: fixed;
        left: 50%;
        top: 50%;
        max-width: 34rem;
        padding: 20px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--ink);
        text-align: center;
        transform: translate(-50%, -50%);

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

      }

  </head>
  <body>
    <main class="stage" id="stage">
      <section class="frame" id="frame" aria-label="Interactive booklet preview">
        <div class="book-mount" id="bookMount">

    </main>
    <div class="message" id="message" hidden>Loading booklet...</div>
    <div class="preload" id="preload" hidden>
      <img class="preload-poster" id="preloadPoster" alt="" hidden />
      <div class="preload-dim"></div>
      <div class="preload-bar" role="progressbar" aria-label="Loading booklet"><span id="preloadFill"></span></div>
    </div>
    <script src="./vendor/page-flip.browser.js"></script>
    <script type="module">
      import * as pdfjsLib from "./vendor/pdf.min.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdf.worker.min.mjs";

      const FLIP_BEHAVIOR = {"duration":540,"motionBleed":{"ratio":0.08,"min":8,"max":32},"texture":{"maxOpacity":0.34},"cornerHint":{"delay":120,"enterDuration":360,"exitDuration":220,"extentRatio":0.10,"minExtent":36,"maxExtent":84,"startExtent":2.5,"foldShadowBoost":0.65},"shadow":{"contactY":4,"contactBlur":8,"contactAlpha":0.3,"ambientY":22,"ambientBlur":42,"ambientAlpha":0.24,"gutterAlpha":0.38,"dynamicOpacity":0.9}};
      const PageFlip = window.St && window.St.PageFlip;
      const stage = document.getElementById("stage");
      const frame = document.getElementById("frame");
      const bookMount = document.getElementById("bookMount");
      const bookEngine = document.getElementById("bookEngine");
      const message = document.getElementById("message");
      const preload = document.getElementById("preload");
      const preloadPoster = document.getElementById("preloadPoster");
      const preloadFill = document.getElementById("preloadFill");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      let compactTapMode = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
      let compactTurnLocked = false;
      let compactTurnTimer = 0;
      const expectedParentOrigin = (() => {
        if (!document.referrer) return null;
        try {
          return new URL(document.referrer).origin;
        } catch (error) {
          return null;
        }
      })();

      let config;
      let pageFlip = null;
      let book = null;
      let pageBlueprints = [];
      let pageElements = [];
      let currentPage = 0;
      let engineState = "read";
      let resizeFrame = 0;
      let turnFrame = 0;
      let turnQueued = false;
      let cornerTimer = 0;
      let cornerFrame = 0;
      let cornerExtent = 0;
      let hoveredCornerSide = null;
      let activeCornerSide = null;
      let preloadTimer = 0;
      const boundaryTurnClasses = [
        "is-opening-cover",
        "is-closing-cover",
        "is-opening-back-cover",
        "is-closing-back-cover",
      ];
      const decodeCache = new Map();
      const pageObjectUrls = new Set();
      const renderCache = new Map();
      const renderJobs = new Map();
      const pendingPageUri = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="9"><rect width="16" height="9" fill="#f8f8f8"/></svg>',
      );
      const RENDER_CACHE_LIMIT = 12;

      function releaseCompactTurn() {
        window.clearTimeout(compactTurnTimer);
        compactTurnTimer = 0;
        compactTurnLocked = false;
      }

      function syncBookletMode(compact) {
        compactTapMode = Boolean(compact);
        document.documentElement.classList.toggle("mms-parent-turn", compactTapMode);
        releaseCompactTurn();
        if (compactTapMode) {
          hoveredCornerSide = null;
          window.clearTimeout(cornerTimer);
          dismissCornerFold(true);
        }
      }

      syncBookletMode(compactTapMode);

      function isValidatedParentMessage(event) {
        return event.source === window.parent &&
          expectedParentOrigin !== null &&
          event.origin === expectedParentOrigin;
      }

      function receiveCompactTurn(data) {
        if (!compactTapMode || !pageFlip || compactTurnLocked || turnQueued || engineState !== "read") return;
        if (!data || data.__mmsBookletTurn !== 1) return;
        const position = Number(data.position);
        if (!Number.isFinite(position) || position < 0 || position > 1) return;
        if (position >= 0.46 && position <= 0.54) return;
        const expectedDirection = position < 0.5 ? "previous" : "next";
        if (data.direction !== expectedDirection) return;
        compactTurnLocked = true;
        compactTurnTimer = window.setTimeout(releaseCompactTurn, 700);
        requestTurn(expectedDirection);
      }

      window.addEventListener("message", (event) => {
        if (!isValidatedParentMessage(event)) return;
        const data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.__mmsBookletMode === 1 && typeof data.compact === "boolean") {
          syncBookletMode(data.compact);
          return;
        }
        receiveCompactTurn(data);
      });

      if (expectedParentOrigin !== null && window.parent !== window) {
        window.parent.postMessage({
          __mmsBookletReady: 1,
          kind: "montran-booklet",
          version: 17,

      const RENDER_WIDTH_LIMIT = 1600;
      let activePdf = null;
      let renderPageFn = null;
      let renderQueue = Promise.resolve();
      let lastRenderTargetWidth = 0;
      let baseDynamicShadow = FLIP_BEHAVIOR.shadow.dynamicOpacity;

      function showMessage(text) {
        message.textContent = text;
        message.hidden = !text;
      }

      function setProgress(fraction) {
        preloadFill.style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + "%";
      }

      function showPreload() {
        const poster = config && config.viewerOptions && config.viewerOptions.loadingPoster;
        if (poster) {
          preloadPoster.src = poster;
          preloadPoster.hidden = false;

        preload.classList.remove("is-done", "is-visible");
        preload.hidden = true;
        setProgress(0.04);
        window.clearTimeout(preloadTimer);
        preloadTimer = window.setTimeout(() => {
          preload.hidden = false;
          window.requestAnimationFrame(() => preload.classList.add("is-visible"));

      }

      function finishPreload() {
        window.clearTimeout(preloadTimer);
        setProgress(1);
        if (preload.hidden) return;
        window.setTimeout(() => {
          preload.classList.remove("is-visible");
          preload.classList.add("is-done");
          window.setTimeout(() => { preload.hidden = true; }, 500);
        }, 180);
      }

      function hidePreload() {
        window.clearTimeout(preloadTimer);
        preload.classList.remove("is-visible");
        preload.classList.add("is-done");
        preload.hidden = true;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function fitRect(containerWidth, containerHeight, ratio) {
        if (containerWidth / containerHeight > ratio) {
          return { width: containerHeight * ratio, height: containerHeight };
        }
        return { width: containerWidth, height: containerWidth / ratio };
      }

      function getMotionBleed(pageHeight) {
        const motion = FLIP_BEHAVIOR.motionBleed;
        return clamp(pageHeight * motion.ratio, motion.min, motion.max);
      }

      function getShadowValues(value) {
        const strength = clamp(value, 0, 100) / 100;
        const shadow = FLIP_BEHAVIOR.shadow;
        return {
          contactY: shadow.contactY * strength,
          contactBlur: shadow.contactBlur * strength,
          contactAlpha: shadow.contactAlpha * strength,
          ambientY: shadow.ambientY * strength,
          ambientBlur: shadow.ambientBlur * strength,
          ambientAlpha: shadow.ambientAlpha * strength,
          gutterAlpha: shadow.gutterAlpha * strength,
          dynamicOpacity: shadow.dynamicOpacity * strength,
        };
      }

      async function renderPdfPage(pdf, pageNumber, targetWidth) {
        const page = await pdf.getPage(pageNumber);
        const initialViewport = page.getViewport({ scale: 1 });
        const safeTargetWidth = Math.min(RENDER_WIDTH_LIMIT, Math.max(320, Math.ceil(targetWidth)));
        const scale = Math.min(4, Math.max(0.1, safeTargetWidth / initialViewport.width));
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvas, canvasContext: context, viewport }).promise;
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("A rendered PDF page could not be encoded.");
        const imageUrl = URL.createObjectURL(blob);
        pageObjectUrls.add(imageUrl);
        return { pageNumber, imageUrl, width: canvas.width, height: canvas.height };
      }

      function getRenderTargetWidth() {
        const layout = calculateLayout();
        const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
        return Math.min(RENDER_WIDTH_LIMIT, Math.ceil(layout.pageWidth * dpr));
      }

      function currentProtectedPdfPages() {
        const source = pageBlueprints[currentPage] && pageBlueprints[currentPage].sourcePageNumber;
        if (!source) return new Set();
        const spreadLeft = source % 2 === 0 ? source - 1 : source;
        const protectedPages = new Set();
        for (let page = spreadLeft - 2; page <= spreadLeft + 5; page += 1) {
          if (activePdf && page >= 1 && page <= activePdf.numPages) protectedPages.add(page);
        }
        return protectedPages;
      }

      function applyRenderedPage(renderedPage) {
        const index = pageBlueprints.findIndex((blueprint) => blueprint.sourcePageNumber === renderedPage.pageNumber);
        if (index < 0) return;
        pageBlueprints[index].imageUrl = renderedPage.imageUrl;
        const image = pageElements[index] && pageElements[index].querySelector("img");
        if (image) image.src = renderedPage.imageUrl;
      }

      function evictRenderCache() {
        const protectedPages = currentProtectedPdfPages();
        while (renderCache.size > RENDER_CACHE_LIMIT) {
          let victim = null;
          for (const pageNumber of renderCache.keys()) {

          if (victim === null) victim = renderCache.keys().next().value;
          const renderedPage = renderCache.get(victim);
          renderCache.delete(victim);
          if (renderedPage && renderedPage.imageUrl.startsWith("blob:")) {
            URL.revokeObjectURL(renderedPage.imageUrl);
            pageObjectUrls.delete(renderedPage.imageUrl);

      function ensurePageRendered(pageNumber, targetWidth = getRenderTargetWidth()) {
        if (!activePdf || !renderPageFn || pageNumber < 1 || pageNumber > activePdf.numPages) return Promise.resolve(null);

        if (cached && cached.width >= targetWidth) {
          renderCache.delete(pageNumber);
          renderCache.set(pageNumber, cached);
          return Promise.resolve(cached);

        if (renderJobs.has(pageNumber)) return renderJobs.get(pageNumber);

          const renderedPage = await renderPageFn(activePdf, pageNumber, targetWidth);
          const previous = renderCache.get(pageNumber);
          if (previous && previous.imageUrl !== renderedPage.imageUrl && previous.imageUrl.startsWith("blob:")) {
            URL.revokeObjectURL(previous.imageUrl);
            pageObjectUrls.delete(previous.imageUrl);

          renderCache.delete(pageNumber);
          renderCache.set(pageNumber, renderedPage);
          applyRenderedPage(renderedPage);
          evictRenderCache();

        renderJobs.set(pageNumber, job);
        job.then(
          () => renderJobs.delete(pageNumber),
          () => renderJobs.delete(pageNumber),

      function queuePdfPages(pageNumbers, targetWidth = getRenderTargetWidth()) {

      function queueDirectionalNeighborhood(sourcePage) {
        if (!sourcePage) return Promise.resolve([]);
        const spreadLeft = sourcePage % 2 === 0 ? sourcePage - 1 : sourcePage;
        return queuePdfPages([
          spreadLeft - 2, spreadLeft - 1,
          spreadLeft, spreadLeft + 1,
          spreadLeft + 2, spreadLeft + 3,
          spreadLeft + 4, spreadLeft + 5,

      }

      function createPageElement(page, index) {
        const element = document.createElement("div");
        element.className = "book-page";
        element.dataset.density = page.type === "cover" ? "hard" : "soft";
        element.dataset.pageId = page.id;
        element.dataset.pageIndex = String(index);
        element.dataset.sourcePage = page.sourcePageNumber ? String(page.sourcePageNumber) : "blank";

        const surface = document.createElement("div");
        surface.className = "page-surface";
        surface.classList.add(page.type === "cover" ? "is-cover" : index % 2 === 1 ? "is-left" : "is-right");

        if (page.type === "blank") {
          surface.classList.add("blank-page");
        } else {
          const image = document.createElement("img");
          image.alt = "";
          image.src = page.imageUrl;
          image.decoding = "async";
          image.className = page.type === "cover" ? "cover-image" : "page-image";
          surface.appendChild(image);
        }

        element.appendChild(surface);
        return element;
      }

      function decodeImage(image) {
        const source = image.currentSrc || image.src;
        if (decodeCache.has(source)) return decodeCache.get(source);
        const decoded = (image.decode ? image.decode() : Promise.resolve()).catch(() => undefined);
        decodeCache.set(source, decoded);
        return decoded;

      function decodePagesAround(pageIndex) {
        const start = Math.max(0, pageIndex - 2);
        const end = Math.min(pageElements.length - 1, pageIndex + 4);
        const decodes = [];
        for (let index = start; index <= end; index += 1) {
          const image = pageElements[index] && pageElements[index].querySelector("img");
          if (image) decodes.push(decodeImage(image));
        }
        return Promise.all(decodes);
      }

      function normalizePageDensities() {
        if (!pageFlip) return;
        for (let index = 0; index < pageFlip.getPageCount(); index += 1) {
          const page = pageFlip.getPage(index);
          page.setDrawingDensity(page.getDensity());
        }
      }

      function canFoldCorner(side) {
        if (!pageFlip) return false;
        const pageIndex = pageFlip.getCurrentPageIndex();
        if (side === "left") return pageIndex > 0;
        return pageIndex === 0 ? pageFlip.getPageCount() > 1 : pageIndex + 2 < pageFlip.getPageCount();
      }

      function hasSingleBackCover() {
        return pageFlip && pageFlip.getPageCount() > 1 && pageFlip.getPageCount() % 2 === 0;
      }

      function getBoundaryTurn(direction) {
        if (!pageFlip) return null;
        const pageIndex = pageFlip.getCurrentPageIndex();
        const pageCount = pageFlip.getPageCount();

        if (direction === "previous" && pageIndex === 1) return "is-closing-cover";

        if (direction === "next" && pageIndex === pageCount - 3) return "is-closing-back-cover";

      function setBoundaryTurn(className) {
        bookMount.classList.remove(...boundaryTurnClasses);

        });
      }

      function resetCornerFold() {
        if (!pageFlip || pageFlip.getState() !== "fold_corner") return;
        const bounds = pageFlip.getBoundsRect();
        pageFlip.getFlipController().showCorner({
          x: bounds.left + bounds.width / 2,
          y: bounds.top + bounds.height / 2,
        });
        pageFlip.getRender().finishAnimation();
      }

      function easeOutQuart(progress) {
        return 1 - Math.pow(1 - progress, 4);
      }

      function cancelCornerFrame() {
        window.cancelAnimationFrame(cornerFrame);
        cornerFrame = 0;
      }

      function showCornerFold(side) {
        if (!pageFlip || !canFoldCorner(side) || reducedMotion.matches) return;
        cancelCornerFrame();

        const hint = FLIP_BEHAVIOR.cornerHint;
        if (pageFlip.getState() === "read") {
          setCornerFoldPoint(side, hint.startExtent);
          pageFlip.getRender().finishAnimation();
          setCornerFoldPoint(side, hint.startExtent);
          cornerExtent = hint.startExtent;
        }
        if (pageFlip.getState() !== "fold_corner") return;

        const foldSettings = pageFlip.getSettings();
        foldSettings.drawShadow = true;
        foldSettings.maxShadowOpacity = Math.max(FLIP_BEHAVIOR.cornerHint.foldShadowBoost, baseDynamicShadow);

        activeCornerSide = side;
        const from = Math.max(hint.startExtent, cornerExtent);
        const target = getCornerHintExtent();
        const startedAt = performance.now();
        const step = (now) => {
          if (!pageFlip || hoveredCornerSide !== side || pageFlip.getState() !== "fold_corner") {
            cornerFrame = 0;
            return;
          }

          const progress = clamp((now - startedAt) / hint.enterDuration, 0, 1);
          const extent = from + (target - from) * easeOutQuart(progress);
          cornerExtent = extent;
          setCornerFoldPoint(side, extent);
          cornerFrame = progress < 1 ? requestAnimationFrame(step) : 0;
        };
        cornerFrame = requestAnimationFrame(step);
      }

      function scheduleCornerHint(side) {
        window.clearTimeout(cornerTimer);
        cornerTimer = window.setTimeout(() => {
          cornerTimer = 0;
          if (hoveredCornerSide === side && engineState === "read") showCornerFold(side);
        }, FLIP_BEHAVIOR.cornerHint.delay);
      }

      function dismissCornerFold(immediate = false) {
        window.clearTimeout(cornerTimer);
        cornerTimer = 0;
        cancelCornerFrame();

        if (!pageFlip || pageFlip.getState() !== "fold_corner") {
          activeCornerSide = null;
          cornerExtent = 0;
          return;
        }

        const side = activeCornerSide;
        if (immediate || !side || reducedMotion.matches) {
          resetCornerFold();
          activeCornerSide = null;
          cornerExtent = 0;
          return;
        }

        const hint = FLIP_BEHAVIOR.cornerHint;
        const from = Math.max(hint.startExtent, cornerExtent);
        const startedAt = performance.now();
        const step = (now) => {
          if (!pageFlip || pageFlip.getState() !== "fold_corner") {
            cornerFrame = 0;
            return;
          }

          const progress = clamp((now - startedAt) / hint.exitDuration, 0, 1);
          const extent = from + (hint.startExtent - from) * easeOutQuart(progress);
          cornerExtent = extent;
          setCornerFoldPoint(side, extent);
          if (progress < 1) {
            cornerFrame = requestAnimationFrame(step);
          } else {
            cornerFrame = 0;
            resetCornerFold();
            activeCornerSide = null;
            cornerExtent = 0;
          }
        };
        cornerFrame = requestAnimationFrame(step);
      }

      function prepareCoverTurn(direction) {
        if (!pageFlip || pageFlip.getPageCount() < 2) return;
        const pageIndex = pageFlip.getCurrentPageIndex();
        const crossesCover = (direction === "next" && pageIndex === 0) || (direction === "previous" && pageIndex === 1);
        if (!crossesCover) return;
        pageFlip.getPage(0).setDrawingDensity("hard");
        pageFlip.getPage(1).setDrawingDensity("hard");
      }

      function setBackground() {
        const transparent = Boolean(config.background.transparent);
        const image = !transparent && config.background.imageFile
          ? "url('" + config.background.imageFile.replace(/'/g, "%27") + "')"
          : "none";
        document.body.classList.toggle("has-transparent-background", transparent);
        frame.style.setProperty("--booklet-bg", transparent ? "transparent" : config.background.color || "oklch(90% 0 0)");
        frame.style.setProperty("--booklet-bg-image", image);
      }

      function getPageFinish() {
        return config.viewerOptions.pageFinish || { paperTexture: 0, pageShadow: 18 };
      }

      function setPageFinish() {
        const finish = getPageFinish();
        const texture = clamp(Number(finish.paperTexture) || 0, 0, 100) / 100;
        const shadow = getShadowValues(Number(finish.pageShadow) || 0);
        bookMount.style.setProperty("--paper-texture-strength", String(texture));
        bookMount.style.setProperty("--paper-texture-opacity", String(texture * FLIP_BEHAVIOR.texture.maxOpacity));
        bookMount.style.setProperty("--shadow-contact-y", shadow.contactY + "px");
        bookMount.style.setProperty("--shadow-contact-blur", shadow.contactBlur + "px");
        bookMount.style.setProperty("--shadow-contact-alpha", String(shadow.contactAlpha));
        bookMount.style.setProperty("--shadow-ambient-y", shadow.ambientY + "px");
        bookMount.style.setProperty("--shadow-ambient-blur", shadow.ambientBlur + "px");
        bookMount.style.setProperty("--shadow-ambient-alpha", String(shadow.ambientAlpha));
        bookMount.style.setProperty("--page-gutter-alpha", String(shadow.gutterAlpha));
        baseDynamicShadow = shadow.dynamicOpacity;
        if (pageFlip) {
          const settings = pageFlip.getSettings();
          settings.drawShadow = shadow.dynamicOpacity > 0;
          settings.maxShadowOpacity = shadow.dynamicOpacity;
        }
      }

      function setStatus() {
        if (!pageBlueprints.length) return;
        bookMount.classList.toggle("is-cover", currentPage === 0);
        bookMount.classList.toggle(
          "is-back-cover",
          pageBlueprints.length > 1 && pageBlueprints.length % 2 === 0 && currentPage === pageBlueprints.length - 1,
        );
      }

      function calculateLayout() {
        const stageBox = stage.getBoundingClientRect();
        const frameRatio = config.ratio.width / config.ratio.height;
        const bare = document.body.classList.contains("controls-hidden");
        const frameBox = fitRect(
          Math.max(1, stageBox.width),
          Math.max(1, stageBox.height),
          frameRatio,
        );
        const vmin = Math.min(frameBox.width, frameBox.height);
        const padding = clamp(
          vmin * (config.viewerOptions.padding.preferredVmin / 100),
          config.viewerOptions.padding.min,
          config.viewerOptions.padding.max,
        );
        const preliminaryBook = fitRect(
          Math.max(1, frameBox.width - padding * 2),
          Math.max(1, frameBox.height - padding * 2),
          config.spreadRatio || 1.55,
        );
        const motionBleed = bare ? 0 : getMotionBleed(preliminaryBook.height);
        const bookBox = fitRect(
          Math.max(1, frameBox.width - (padding + motionBleed) * 2),
          Math.max(1, frameBox.height - (padding + motionBleed) * 2),
          config.spreadRatio || 1.55,
        );
        const pageWidth = Math.max(40, Math.floor(bookBox.width / 2));
        const pageHeight = Math.max(60, Math.floor(bookBox.height));

        frame.style.width = Math.floor(frameBox.width) + "px";
        frame.style.height = Math.floor(frameBox.height) + "px";
        bookMount.style.width = pageWidth * 2 + "px";
        bookMount.style.height = pageHeight + "px";
        return { pageWidth, pageHeight, bookWidth: pageWidth * 2, bookHeight: pageHeight };
      }

      function applyLayout() {
        const layout = calculateLayout();
        if (!pageFlip || !book) return layout;
        const settings = pageFlip.getSettings();
        settings.width = layout.pageWidth;
        settings.height = layout.pageHeight;
        settings.minWidth = layout.pageWidth;
        settings.maxWidth = layout.pageWidth;
        settings.minHeight = layout.pageHeight;
        settings.maxHeight = layout.pageHeight;
        book.style.width = layout.bookWidth + "px";
        book.style.height = layout.bookHeight + "px";
        book.style.minWidth = layout.bookWidth + "px";
        book.style.minHeight = layout.bookHeight + "px";
        pageFlip.update();
        return layout;
      }

      async function initializeFlipBook() {
        if (!PageFlip) {
          showMessage("The page flip library could not load. Check the vendor files in this folder.");
          return;
        }

        const layout = calculateLayout();
        pageElements = pageBlueprints.map(createPageElement);
        await decodePagesAround(0);
        book = document.createElement("div");
        book.className = "flip-book";
        bookEngine.replaceChildren(book);
        const finish = getPageFinish();
        const shadow = getShadowValues(Number(finish.pageShadow) || 0);

        pageFlip = new PageFlip(book, {
          width: layout.pageWidth,
          height: layout.pageHeight,
          size: "fixed",
          startPage: 0,
          drawShadow: shadow.dynamicOpacity > 0,
          flippingTime: FLIP_BEHAVIOR.duration,
          usePortrait: false,
          autoSize: false,
          maxShadowOpacity: shadow.dynamicOpacity,
          showCover: true,
          mobileScrollSupport: false,
          swipeDistance: 24,
          clickEventForward: true,
          useMouseEvents: true,
          showPageCorners: false,
        });

        pageFlip.loadFromHTML(pageElements);
        normalizePageDensities();
        pageFlip.on("flip", (event) => {
          currentPage = event.data;
          setStatus();
          void decodePagesAround(currentPage);
          const sourcePage = pageBlueprints[currentPage] && pageBlueprints[currentPage].sourcePageNumber;
          void queueDirectionalNeighborhood(sourcePage);
        });
        pageFlip.on("changeState", (event) => {
          engineState = event.data;
          const isTurning = engineState === "flipping" || engineState === "user_fold";
          bookMount.classList.toggle("is-motion-active", engineState !== "read");
          bookMount.classList.toggle("is-flipping", isTurning);
          if (engineState !== "read") bookMount.classList.remove("is-preparing-motion", "is-preparing-cover");
          if (engineState === "read") {
            releaseCompactTurn();
            turnQueued = false;
            setBoundaryTurn(null);
            pageFlip.getSettings().maxShadowOpacity = baseDynamicShadow;
            normalizePageDensities();
            void decodePagesAround(currentPage);
            const hoveredSide = hoveredCornerSide;
            if (hoveredSide && !reducedMotion.matches && canFoldCorner(hoveredSide)) {
              scheduleCornerHint(hoveredSide);
            }
          }
          setStatus();
        });
        applyLayout();
        let startIndex = 0;
        const startPdfPage = Number(config.viewerOptions && config.viewerOptions.startAtPdfPage);
        if (startPdfPage) {
          const index = pageBlueprints.findIndex((blueprint) => blueprint.sourcePageNumber === startPdfPage);
          if (index > 0) startIndex = index % 2 === 0 ? index - 1 : index;
        }
        if (startIndex > 0) {
          currentPage = startIndex;
          await decodePagesAround(startIndex);
        }
        pageFlip.turnToPage(startIndex);
        setPageFinish();
        setStatus();
        showMessage("");
      }

      function requestTurn(direction) {
        if (!pageFlip || turnQueued || engineState === "flipping" || engineState === "user_fold") return;
        if (direction === "previous" && pageFlip.getCurrentPageIndex() <= 0) return;
        if (direction === "next" && !canFoldCorner("right")) return;
        hoveredCornerSide = null;

        const performTurn = () => {
          if (reducedMotion.matches) {
            setBoundaryTurn(null);
            if (direction === "previous") pageFlip.turnToPrevPage();
            else pageFlip.turnToNextPage();
          } else {
            turnQueued = true;
            setBoundaryTurn(getBoundaryTurn(direction));
            prepareCoverTurn(direction);
            bookMount.classList.add("is-preparing-motion");
            if (direction === "previous" && pageFlip.getCurrentPageIndex() === 1) {
              bookMount.classList.add("is-preparing-cover");
            }
            turnFrame = requestAnimationFrame(() => {
              turnFrame = requestAnimationFrame(() => {
                turnFrame = requestAnimationFrame(() => {
                  turnQueued = false;
                  bookMount.classList.remove("is-preparing-cover");
                  if (direction === "previous") pageFlip.flipPrev("bottom");
                  else pageFlip.flipNext("bottom");
                });
              });
            });
          }
        };

        if (engineState === "fold_corner") {
          dismissCornerFold(true);
          cornerTimer = window.setTimeout(performTurn, 64);
        } else {
          performTurn();
        }
      }

      async function loadBooklet() {
        try {
          config = await fetch("./booklet.config.json").then((response) => {
            if (!response.ok) throw new Error("booklet.config.json could not be loaded.");
            return response.json();
          });
          setBackground();
          if (config.viewerOptions && config.viewerOptions.hideControls) {
            document.body.classList.add("controls-hidden");
          }
          if (config.background && !config.background.transparent && config.background.color) {
            document.body.style.background = config.background.color;
          }
          showPreload();

          const pdfParameter = new URLSearchParams(location.search).get("pdf");
          const pdfUrl = pdfParameter || config.pdfFile;
          const updateDownloadProgress = (loaded, total) => {
            if (total) setProgress(0.3 * Math.min(1, loaded / total));
          };

          async function openPdfResilient(url) {
            let firstError;
            try {
              const chunkSize = 262144;
              const metadataResponse = await fetch(url, { method: "HEAD", cache: "default" });
              const totalLength = Number(metadataResponse.headers.get("content-length"));
              if (!metadataResponse.ok || !Number.isFinite(totalLength) || totalLength <= 0) {
                throw new Error("PDF length probe unavailable (HTTP " + metadataResponse.status + ")");
              }
              const initialResponse = await fetch(url, {
                headers: { Range: "bytes=0-" + (chunkSize - 1) },
                cache: "default",
              });
              if (initialResponse.status !== 206) {
                throw new Error("Range loading unavailable (HTTP " + initialResponse.status + ")");
              }
              const initialData = new Uint8Array(await initialResponse.arrayBuffer());
              class FreightRangeTransport extends pdfjsLib.PDFDataRangeTransport {
                constructor() {
                  super(totalLength, initialData, false);
                  this.controllers = new Set();
                }
                requestDataRange(begin, end) {
                  const controller = new AbortController();
                  this.controllers.add(controller);
                  fetch(url, {
                    headers: { Range: "bytes=" + begin + "-" + (end - 1) },
                    cache: "default",
                    signal: controller.signal,
                  }).then(async (response) => {
                    if (response.status !== 206) throw new Error("Range request failed (HTTP " + response.status + ")");
                    this.onDataRange(begin, new Uint8Array(await response.arrayBuffer()));
                  }).finally(() => this.controllers.delete(controller));
                }
                abort() {
                  for (const controller of this.controllers) controller.abort();
                  this.controllers.clear();
                }
              }
              const range = new FreightRangeTransport();
              const task = pdfjsLib.getDocument({
                range,
                disableAutoFetch: true,
                disableStream: true,
                rangeChunkSize: chunkSize,
              });
              task.onProgress = (progress) => progress && updateDownloadProgress(progress.loaded, progress.total);
              range.transportReady();
              return await task.promise;
            } catch (error) {
              firstError = error;
            }

            const response = await fetch(url, { cache: "default" });
            if (!response.ok) {
              throw new Error(
                "The PDF could not be fetched (HTTP " + response.status + "; first error: " +
                  (firstError && firstError.message) + ")",
              );
            }

            let data;
            const total = Number(response.headers.get("content-length")) || 0;
            if (response.body && response.body.getReader) {
              const reader = response.body.getReader();
              const chunks = [];
              let received = 0;
              for (;;) {
                const result = await reader.read();
                if (result.done) break;
                chunks.push(result.value);
                received += result.value.length;
                updateDownloadProgress(received, total);
              }
              data = new Uint8Array(received);
              let offset = 0;
              for (const chunk of chunks) {
                data.set(chunk, offset);
                offset += chunk.length;
              }
            } else {
              data = new Uint8Array(await response.arrayBuffer());
            }

            const magic = String.fromCharCode.apply(null, Array.from(data.slice(0, 5)));
            if (magic.indexOf("%PDF") !== 0) {
              const hex = Array.from(data.slice(0, 8))
                .map((byte) => byte.toString(16).padStart(2, "0"))
                .join(" ");
              throw new Error(
                "The network returned a non-PDF response (" + data.length + " bytes, starts " + hex +
                  "; first error: " + (firstError && firstError.message) + ")",
              );
            }

            return await pdfjsLib.getDocument({ data, disableAutoFetch: true, disableStream: true }).promise;
          }

          const imageMode = Array.isArray(config.pageImages) && config.pageImages.length > 0;
          const pageImageUrl = (pageNumber) => config.pageImages[pageNumber - 1];
          const preloadImage = (url) => new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(url);
            image.onerror = () => resolve(url);
            image.src = url;
          });

          let pdf;
          if (imageMode && !pdfParameter) {
            pdf = { numPages: config.pageImages.length };
            renderPageFn = async (_document, pageNumber) => {
              await preloadImage(pageImageUrl(pageNumber));
              return { pageNumber, imageUrl: pageImageUrl(pageNumber), width: RENDER_WIDTH_LIMIT, height: 900 };
            };
          } else {
            pdf = await openPdfResilient(pdfUrl);
            renderPageFn = renderPdfPage;
          }
          activePdf = pdf;
          lastRenderTargetWidth = getRenderTargetWidth();
          const startPdfPage = Number((config.viewerOptions || {}).startAtPdfPage) || 19;
          const startLeft = startPdfPage % 2 === 0 ? startPdfPage - 1 : startPdfPage;
          const requiredStartingPages = [startLeft, startLeft + 1, startLeft - 2, startLeft - 1, startLeft + 2, startLeft + 3];
          let requiredComplete = 0;
          for (const pageNumber of requiredStartingPages) {
            await ensurePageRendered(pageNumber, lastRenderTargetWidth);
            requiredComplete += 1;
            setProgress(0.35 + 0.55 * (requiredComplete / requiredStartingPages.length));
          }

          const cachedCover = renderCache.get(1);
          pageBlueprints = [{ id: "cover", type: "cover", imageUrl: cachedCover ? cachedCover.imageUrl : pendingPageUri, sourcePageNumber: 1 }];
          const pageSequence = Array.isArray(config.pageSequence)
            ? config.pageSequence
            : config.spreadSequence.flatMap((item) =>
                item.type === "blank"
                  ? [
                      { type: "blank", id: item.id + "-left" },
                      { type: "blank", id: item.id + "-right" },
                    ]
                  : [
                      { type: "pdf", pageNumber: item.leftPageNumber },
                      ...(item.rightPageNumber ? [{ type: "pdf", pageNumber: item.rightPageNumber }] : [{ type: "blank", id: "legacy-facing-blank" }]),
                    ],
              );

          for (const item of pageSequence) {
            if (item.type === "blank") {
              pageBlueprints.push({ id: item.id, type: "blank" });
            } else {
              const pdfPage = renderCache.get(item.pageNumber);
              pageBlueprints.push({
                id: "page-" + item.pageNumber,
                type: "pdf",
                imageUrl: pdfPage ? pdfPage.imageUrl : pendingPageUri,
                sourcePageNumber: item.pageNumber,
              });
            }
          }

          await initializeFlipBook();
          finishPreload();
          const idleStage = () => { void queuePdfPages([startLeft - 4, startLeft - 3, startLeft + 4, startLeft + 5]); };
          if ("requestIdleCallback" in window) window.requestIdleCallback(idleStage, { timeout: 1200 });
          else window.setTimeout(idleStage, 350);
        } catch (error) {
          console.error(error);
          hidePreload();
          showMessage(error instanceof Error ? error.message : "The booklet could not be loaded.");
        }
      }

      function updateHoveredCorner(event) {
        if (event.pointerType !== "mouse" || reducedMotion.matches) {
          hoveredCornerSide = null;
          dismissCornerFold();
          return;
        }

        const bounds = bookMount.getBoundingClientRect();
        const pointerX = event.clientX - bounds.left;
        let side = pointerX < bounds.width / 2 ? "left" : "right";
        if (!canFoldCorner(side)) side = null;
        if (hoveredCornerSide === side) return;
        const previousSide = hoveredCornerSide;
        hoveredCornerSide = side;

        if (engineState === "flipping" || engineState === "user_fold") return;
        if (!side) {
          dismissCornerFold();
          return;
        }

        if (engineState === "fold_corner" && previousSide !== side) {
          dismissCornerFold();
          return;
        }

        if (engineState === "read") scheduleCornerHint(side);
      }

      bookMount.addEventListener("pointerenter", updateHoveredCorner);
      bookMount.addEventListener("pointermove", updateHoveredCorner);
      bookMount.addEventListener("pointerleave", () => {
        hoveredCornerSide = null;
        window.clearTimeout(cornerTimer);
        dismissCornerFold();
      });
      bookMount.addEventListener("pointerdown", (event) => {
        if (compactTapMode) return;
        if (!reducedMotion.matches) {
          const bounds = bookMount.getBoundingClientRect();
          const direction = event.clientX - bounds.left < bounds.width / 2 ? "previous" : "next";
          setBoundaryTurn(getBoundaryTurn(direction));
        }
        bookMount.classList.add("is-preparing-motion");
      });
      bookMount.addEventListener("pointerup", () => {
        if (compactTapMode) return;
        requestAnimationFrame(() => {
          if (engineState === "read" && !turnQueued) {
            setBoundaryTurn(null);
            bookMount.classList.remove("is-preparing-motion");
          }
        });
      });
      bookMount.addEventListener("pointercancel", () => {
        if (compactTapMode) return;
        setBoundaryTurn(null);
        bookMount.classList.remove("is-preparing-motion");
      });

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(turnFrame);
        cancelCornerFrame();
        for (const url of pageObjectUrls) URL.revokeObjectURL(url);
      });

      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          applyLayout();
          const targetWidth = getRenderTargetWidth();
          if (targetWidth > lastRenderTargetWidth * 1.12) {
            lastRenderTargetWidth = targetWidth;
            const sourcePage = pageBlueprints[currentPage] && pageBlueprints[currentPage].sourcePageNumber;
            void queueDirectionalNeighborhood(sourcePage);
          }
        });
      });

      loadBooklet();
    </script>
  </body>
</html>
